<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Bank Donor List</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
      <header class="topbar">
        <div class="header-row">
          <div>
            <h1>Abadan Blood Bank</h1>
          </div>
          <button id="openCreateModal" class="primary-btn header-btn">Add Donor</button>
        </div>
      </header>

      <div class="top-slider" aria-label="Abadan Blood Bank banner">
        <div class="slider-track">
          <span class="slide-item" style="background-image:url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&w=1200&q=80');"></span>
          <span class="slide-item" style="background-image:url('https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=1200&q=80');"></span>
          <span class="slide-item" style="background-image:url('https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=1200&q=80');"></span>
          <span class="slide-item" style="background-image:url('https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=1200&q=80');"></span>
          <span class="slide-item" style="background-image:url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?auto=format&fit=crop&w=1200&q=80');"></span>
          <span class="slide-item" style="background-image:url('https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=1200&q=80');"></span>
        </div>
        <div class="banner-overlay">
          <span class="banner-tag">Abadan Blood Bank</span>
          <h2>Donor List</h2>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-row">
          <input
            id="searchInput"
            type="search"
            class="search-input"
            placeholder="Search by blood group, name, gender, last donation, age, or location"
            aria-label="Search donors"
          />

          <div class="page-size-wrap">
            <span class="results-summary" id="resultsSummary">Results: 0 - 0 of 0</span>
            <label class="page-size-control" for="pageSizeSelect">
              <select id="pageSizeSelect" class="page-size-select" aria-label="Results per page">
                <option value="9" selected>9</option>
                <option value="18">18</option>
                <option value="36">36</option>
                <option value="72">72</option>
                <option value="144">144</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <main class="main-content">
        <section id="donor-list" class="donor-grid" aria-live="polite"></section>
        <div class="pagination-shell">
          <div class="pagination-bar">
            <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
            <div class="pagination-results">
              <span class="results-summary" id="resultsSummaryBottom">Results: 0 - 0 of 0</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="donorModal" class="modal hidden" aria-hidden="true">
      <div class="modal-content detail-modal">
        <button id="closeModal" class="close-btn" aria-label="Close donor details">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="donorFormModal" class="modal hidden" aria-hidden="true">
      <div class="modal-content form-modal">
        <button id="closeFormModal" class="close-btn" aria-label="Close donor form">×</button>
        <h2 id="formTitle">Add Donor</h2>
        <form id="donorForm">
          <div class="form-grid">
            <label>
              Name
              <input type="text" name="name" required />
            </label>
            <label>
              Blood Group
              <select name="bloodGroup" required>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </label>
            <label>
              Age
              <input type="number" name="age" min="18" max="65" required />
            </label>
            <label>
              Gender
              <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>
              Phone
              <input type="tel" name="phone" required />
            </label>
            <label>
              Email
              <input type="email" name="email" required />
            </label>
            <label>
              Location
              <input type="text" name="location" required />
            </label>
            <label>
              Last Donation
              <input type="date" name="lastDonation" required />
            </label>
            <label>
              Availability
              <select name="availability" required>
                <option value="Available">Available</option>
                <option value="Busy">Busy</option>
              </select>
            </label>
            <label class="full-width">
              Address
              <input type="text" name="address" required />
            </label>
            <label class="full-width">
              Picture (optional)
              <input type="file" name="picture" accept="image/*" />
            </label>
            <label class="full-width">
              Notes
              <textarea name="notes" rows="4"></textarea>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Save Donor</button>
            <button type="button" id="cancelForm" class="secondary-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
